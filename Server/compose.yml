services:
  db:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      # bind mount ではなく名前付きボリュームを使う(権限問題を避ける)
      - db-data:/var/lib/postgresql/data
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro

volumes:
  db-data:
